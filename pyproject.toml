[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brvm-mcp"
version = "0.1.0"
description = "MCP server exposing BRVM (West African stock exchange) public data to AI assistants"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["mcp", "brvm", "finance", "uemoa", "west-africa", "stock-exchange", "bourse"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pdfplumber>=0.11.0",
]

[project.scripts]
brvm-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/dondirechristian/brvm-mcp"
Repository = "https://github.com/dondirechristian/brvm-mcp"
Issues = "https://github.com/dondirechristian/brvm-mcp/issues"

[tool.setuptools]
py-modules = ["server", "snapshot"]
packages = ["brvm_scraper"]
